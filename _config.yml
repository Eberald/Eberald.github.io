# Basic Site Settings
locale                   : "en-US"
site_theme               : "sunrise"
title                    : "Enrico Veraldi - Astrophysicist"
title_separator          : "-"
name                     : &name "Enrico Veraldi"
description              : &description "Enrico Veraldi personal website"
url                      : "https://Eberald.github.io"
baseurl                  : ""
repository               : "Eberald/Eberald.github.io"
mathjax: true

# Site Author
author:
  # Biographic information
  avatar                 : "EV_picture.jpg"
  name                   : "Enrico Veraldi"
  pronouns               : "he/him"
  bio                    : "I am a PhD student in Astrophysics and Cosmology at SISSA (Trieste, Italy) and a Master student in High Performance Computing at ICTP (Trieste, Italy)."
  location               : "Trieste, Italy"
  employer               : "SISSA"
  email                  : "everaldi@sissa.it"
  uri                    : # URL al sito personale o pagina istituzionale

  # Academic websites & Profiles
  academia               : # URL
  arxiv                  : # URL
  googlescholar          : "https://scholar.google.com/citations?user=BdMcmIkAAAAJ&hl=it"
  inspire-hep            : # URL
  orcid                  : "https://orcid.org/0009-0007-1304-7771"
  pubmed                 : # URL
  researchgate           : # URL
  scopus                 : # URL
  semantic               : # URL (Semantic Scholar)
  ssrn                   : # URL
  zotero                 : # URL

  # Repositories & Professional Networks
  github                 : "Eberald"
  linkedin               : "enrico-veraldi-396603302"

# Publication Categories
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

# Site Features
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Reading & Assets
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .bundle
  - .github
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README
  - vendor
keep_files:
  - .git

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown Processing
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Collection Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Taxonomies
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
